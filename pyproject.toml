[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "schwarzschild-geodesics"
version = "0.1.0"
description = "Hamiltonian RK4 simulation of timelike and null geodesics around a Schwarzschild black hole"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nugie Saputra" }]
keywords = ["general relativity", "black hole", "geodesics", "Runge-Kutta", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "nbmake>=1.5",
    "ipykernel>=6",
    "pre-commit>=3",
]
notebook = ["jupyterlab>=4"]

[project.urls]
Homepage = "https://github.com/NugiePhysics/schwarzschild-geodesics"
Issues = "https://github.com/NugiePhysics/schwarzschild-geodesics/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/schwarzschild"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# Only Python sources and notebooks are linted/formatted, not the Markdown documentation.
extend-exclude = [".archive", "docs", "*.md"]

[tool.ruff.lint]
# Physics notation (M, E, L, ...) is deliberate, so the pep8-naming rules are not enabled.
select = ["E", "F", "I", "B", "UP", "SIM"]
# SIM300 would turn `x == pytest.approx(y)` into the less readable `pytest.approx(y) == x`.
ignore = ["SIM300"]
